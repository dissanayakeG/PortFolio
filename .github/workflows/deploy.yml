name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Copy repository contents via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          source: "."
          target: "/var/www/port-folio"

      - name: Execute remote build and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          script: |
            set -euo pipefail

            echo "User: $(whoami)"
            echo "Home: $HOME"

            # Ensure pnpm is on PATH before checking for it
            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME/bin:$PATH"

            if command -v pnpm >/dev/null 2>&1; then
              echo "pnpm: $(pnpm --version)"
            else
              echo "pnpm not found — installing to $PNPM_HOME"
              curl -fsSL https://get.pnpm.io/install.sh | sh -
              echo "pnpm: $(pnpm --version)"
            fi

            cd /var/www/port-folio

            # Ensure production DATABASE_URL is always set to an absolute path
            if grep -q '^DATABASE_URL=' .env; then
              sed -i 's|^DATABASE_URL=.*|DATABASE_URL=file:/var/www/port-folio/prisma/production.db|' .env
            else
              echo "DATABASE_URL=file:/var/www/port-folio/prisma/production.db" >> .env
            fi

            rm -rf .next node_modules

            # Export env vars for subsequent commands
            set -a
            source .env
            set +a

            echo "DATABASE_URL=$DATABASE_URL"

            # Install deps (including prisma client + cli)
            pnpm install

            # Rebuild native modules to match the current Node version
            pnpm rebuild || pnpm rebuild better-sqlite3

            # Ensure Prisma client is generated for the current schema
            pnpm prisma generate

            # Apply migrations — fail the deploy loudly if this fails
            pnpm prisma migrate deploy

            # Show migration status for debugging
            pnpm prisma migrate status --schema=./prisma/schema.prisma

            # Verify tables exist before building
            if command -v sqlite3 >/dev/null 2>&1; then
              echo "SQLite tables:"
              sqlite3 prisma/production.db ".tables"
            fi

            # Build the Next.js app
            pnpm build

            # Restart or start the process
            pm2 describe port-folio > /dev/null 2>&1 && pm2 restart port-folio --update-env || pm2 start pnpm --name "port-folio" -- start
            pm2 save