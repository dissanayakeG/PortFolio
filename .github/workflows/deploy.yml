name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        ref: main

    - name: Copy repository contents via SCP
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        port: ${{ secrets.PORT }}
        key: ${{ secrets.SSHKEY }}
        source: "."
        target: "/var/www/port-folio"

    -   name: Execute remote build and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          script: |
            set -e

            echo "User: $(whoami)"
            echo "Home: $HOME"

            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME/bin:$PATH"

            echo "PATH=$PATH"
            ls -la "$PNPM_HOME/bin"

            "$PNPM_HOME/bin/pnpm" --version

            cd /var/www/port-folio

            rm -rf .next node_modules

            "$PNPM_HOME/bin/pnpm" install
            "$PNPM_HOME/bin/pnpm" build

            pm2 restart port-folio || pm2 start pnpm --name "port-folio" -- start
