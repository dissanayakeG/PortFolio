name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Copy repository contents via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          source: "."
          target: "/var/www/port-folio"

      - name: Execute remote build and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          script: |
            set -e

            echo "User: $(whoami)"
            echo "Home: $HOME"

            export PNPM_HOME="$HOME/.local/share/pnpm"
            export PATH="$PNPM_HOME/bin:$PATH"

            echo "PATH=$PATH"
            ls -la "$PNPM_HOME/bin"

            "$PNPM_HOME/bin/pnpm" --version

            cd /var/www/port-folio

            # Ensure production environment exists
            grep -q '^DATABASE_URL=' .env || echo "DATABASE_URL=file:/var/www/port-folio/prisma/production.db" >> .env

            rm -rf .next node_modules

            set -a
            source .env
            set +a

            echo "DATABASE_URL=$DATABASE_URL"

            "$PNPM_HOME/bin/pnpm" install

            # Creates DB file + applies migrations
            "$PNPM_HOME/bin/pnpm" prisma migrate deploy

            "$PNPM_HOME/bin/pnpm" build

            pm2 restart port-folio || pm2 start pnpm --name "port-folio" -- start
