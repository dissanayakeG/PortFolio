name: Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          ref: main

      - name: Copy repository contents via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          source: "."
          target: "/var/www/port-folio"

      - name: Execute remote build and restart
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          port: ${{ secrets.PORT }}
          key: ${{ secrets.SSHKEY }}
          script: |
            set -euo pipefail

            echo "User: $(whoami)"
            echo "Home: $HOME"

            # Ensure pnpm is available (install to user home if missing)
            if command -v pnpm >/dev/null 2>&1; then
              echo "pnpm: $(pnpm --version)"
            else
              echo "pnpm not found — installing to $HOME/.local/share/pnpm"
              curl -fsSL https://get.pnpm.io/install.sh | sh -
              export PATH="$HOME/.local/share/pnpm/bin:$PATH"
              echo "pnpm: $(pnpm --version || echo 'install-failed')"
            fi

            cd /var/www/port-folio

            # Ensure production environment exists; use relative sqlite path so Prisma can resolve it from project root
            grep -q '^DATABASE_URL=' .env || echo "DATABASE_URL=file:./prisma/production.db" >> .env

            rm -rf .next node_modules

            # Export env vars for subsequent commands
            set -a
            source .env
            set +a

            echo "DATABASE_URL=$DATABASE_URL"

            # Install deps (including prisma client + cli)
            pnpm install

            # Rebuild native modules to match the current Node version (fixes better-sqlite3 ABI errors)
            pnpm rebuild || pnpm rebuild better-sqlite3 || true

            # Ensure Prisma client is generated for the current schema
            pnpm prisma generate

            # Apply migrations to create any missing tables (will create the sqlite file if needed)
            if pnpm prisma migrate deploy; then
              echo "prisma migrate deploy succeeded"
            else
              echo "prisma migrate deploy failed — attempting prisma db push as fallback"
              pnpm prisma db push --accept-data-loss || true
            fi

            # Show migration status for debugging
            pnpm prisma migrate status --schema=./prisma/schema.prisma || true

            # If sqlite3 is available, list tables for quick verification
            if command -v sqlite3 >/dev/null 2>&1; then
              echo "SQLite tables:"
              sqlite3 prisma/production.db ".tables" || true
            else
              echo "sqlite3 not installed on host — skipping table list"
            fi

            # Build the Next.js app (during build Next will run any getStaticProps/getStaticPaths)
            pnpm build

            # Restart or start the process
            pm2 restart port-folio || pm2 start pnpm --name "port-folio" -- start
